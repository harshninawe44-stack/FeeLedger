name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL database that exists only while this job runs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: feeledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Our settings.py reads these, the same way it reads your local .env file.
    env:
      SECRET_KEY: ci-only-secret-key-for-tests
      DB_NAME: feeledger
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check the project for mistakes
        run: python manage.py check

      - name: Check that no migration is missing
        run: python manage.py makemigrations --check --dry-run

      - name: Run the tests
        run: python manage.py test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
  
    docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build and start the app with its database
        run: docker compose up -d --build

      - name: Wait for the site to answer
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/api/auth/csrf/ > /dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Check the pages
        run: |
          curl -fsS http://localhost:8000/ | grep -qi "<html"
          curl -fsS -o /dev/null http://localhost:8000/static/admin/css/base.css
          curl -fsS -c jar -o /dev/null http://localhost:8000/api/auth/csrf/
          TOKEN=$(grep csrftoken jar | awk '{print $7}')
          curl -fsS -b jar -c jar -H "X-CSRFToken: $TOKEN" -H "Content-Type: application/json" \
            -d '{"username":"owner","password":"Local-Owner-Pass-2026"}' \
            http://localhost:8000/api/auth/login/
          curl -fsS -b jar http://localhost:8000/api/me/ | grep -q '"role":"owner"'

      - name: Show the app logs if something failed
        if: failure()
        run: docker compose logs